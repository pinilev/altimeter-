<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אלטימטר ירושלים</title>
    <link rel="icon" type="image/png" href="צילום מסך 2026-09-22 234740.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .altimeter-circle {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: pulse 4s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.1); }
            50% { transform: scale(1.02); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(255, 255, 255, 0.2); }
            100% { transform: scale(1); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.1); }
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.3);
        }
        
        .ring-1 { width: 270px; height: 270px; animation: spin 20s linear infinite; }
        .ring-2 { width: 240px; height: 240px; border-style: dotted; animation: spin 30s linear infinite reverse; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .altitude-value {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        
        .altitude-unit {
            font-size: 1.5rem;
            opacity: 0.8;
            margin-top: -10px;
            z-index: 10;
        }

        .location-info {
            text-align: center;
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 2rem;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .mountain-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30vh;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg"><path fill="%23ffffff" fill-opacity="0.1" d="M0,224L60,213.3C120,203,240,181,360,186.7C480,192,600,224,720,213.3C840,203,960,149,1080,138.7C1200,128,1320,160,1380,176L1440,192L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z"></path></svg>') no-repeat bottom center;
            background-size: cover;
            z-index: -1;
        }
        .mountain-bg-2 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg"><path fill="%23ffffff" fill-opacity="0.05" d="M0,128L48,144C96,160,192,192,288,181.3C384,171,480,117,576,90.7C672,64,768,64,864,85.3C960,107,1056,149,1152,149.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom center;
            background-size: cover;
            z-index: -2;
        }

    </style>
</head>
<body>

    <div class="mountain-bg-2"></div>
    <div class="mountain-bg"></div>

    <div class="mb-8 text-center z-10">
        <h1 class="text-3xl md:text-4xl font-bold mb-2">מד גובה דיגיטלי</h1>
        <p class="text-blue-200 text-lg">מבוסס על מיקום נוכחי</p>
    </div>

    <div class="altimeter-circle mb-8">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        
        <div class="flex items-center space-x-2 space-x-reverse z-10 text-blue-200 mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 11l7-7 7 7M5 19l7-7 7 7" />
            </svg>
            <span class="font-medium tracking-wide">גובה</span>
        </div>

        <div class="altitude-value" id="altitudeDisplay">---</div>
        <div class="altitude-unit">מטרים מעל פני הים</div>
    </div>

    <div class="location-info w-11/12 max-w-md z-10 shadow-lg">
        <div class="flex items-center justify-center space-x-2 space-x-reverse mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
            </svg>
            <h2 class="text-xl font-bold" id="locationName">ירושלים, ישראל</h2>
        </div>
        
        <div class="grid grid-cols-2 gap-4 text-sm mt-4 border-t border-white/20 pt-4">
            <div>
                <p class="text-blue-200 mb-1">גובה ממוצע בעיר</p>
                <p class="font-semibold text-lg">~754 מטרים</p>
            </div>
            <div>
                <p class="text-blue-200 mb-1">דיוק משוער</p>
                <p class="font-semibold text-lg" id="accuracyDisplay">מבוסס נתונים</p>
            </div>
        </div>
        
        <button id="updateBtn" class="mt-6 bg-white/20 hover:bg-white/30 transition-colors px-6 py-2 rounded-full font-medium flex items-center justify-center mx-auto space-x-2 space-x-reverse">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span>נסה למצוא גובה מדויק מ-GPS</span>
        </button>
        <p id="statusMsg" class="text-xs text-center mt-2 text-blue-200 h-4"></p>
    </div>

    <script>
        const altitudeDisplay = document.getElementById('altitudeDisplay');
        const updateBtn = document.getElementById('updateBtn');
        const statusMsg = document.getElementById('statusMsg');
        const accuracyDisplay = document.getElementById('accuracyDisplay');

        // Initial default value for Jerusalem
        const defaultJerusalemAltitude = 754;
        
        // Function to animate numbers
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Ease out quart
                const easeOut = 1 - Math.pow(1 - progress, 4);
                obj.innerHTML = Math.floor(easeOut * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Initialize with default Jerusalem altitude
        setTimeout(() => {
            animateValue(altitudeDisplay, 0, defaultJerusalemAltitude, 2000);
        }, 500);

        // Try to get precise altitude from device GPS if user requests
        updateBtn.addEventListener('click', () => {
            if (!("geolocation" in navigator)) {
                statusMsg.textContent = "שירותי מיקום אינם נתמכים בדפדפן זה.";
                return;
            }

            statusMsg.textContent = "מחפש אות GPS...";
            updateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            updateBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    updateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    updateBtn.disabled = false;
                    
                    const altitude = position.coords.altitude;
                    const accuracy = position.coords.altitudeAccuracy;

                    if (altitude !== null) {
                        const targetAltitude = Math.round(altitude);
                        const currentVal = parseInt(altitudeDisplay.innerText) || 0;
                        animateValue(altitudeDisplay, currentVal, targetAltitude, 1500);
                        
                        statusMsg.textContent = "הגובה עודכן בהצלחה מ-GPS.";
                        statusMsg.classList.add('text-green-300');
                        statusMsg.classList.remove('text-blue-200', 'text-red-300');
                        
                        if (accuracy) {
                            accuracyDisplay.textContent = `±${Math.round(accuracy)} מטרים`;
                        } else {
                             accuracyDisplay.textContent = "GPS (ללא דיוק)";
                        }
                    } else {
                        statusMsg.textContent = "אות GPS התקבל, אך לא סופק נתון גובה.";
                        statusMsg.classList.add('text-red-300');
                        statusMsg.classList.remove('text-blue-200', 'text-green-300');
                    }
                },
                (error) => {
                    updateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    updateBtn.disabled = false;
                    statusMsg.classList.add('text-red-300');
                    statusMsg.classList.remove('text-blue-200', 'text-green-300');
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            statusMsg.textContent = "הגישה למיקום נדחתה על ידי המשתמש.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            statusMsg.textContent = "מידע על המיקום אינו זמין כעת.";
                            break;
                        case error.TIMEOUT:
                            statusMsg.textContent = "זמן הבקשה למיקום פג.";
                            break;
                        default:
                            statusMsg.textContent = "אירעה שגיאה לא ידועה בעת הבאת המיקום.";
                            break;
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });
    </script>
</body>
</html>
